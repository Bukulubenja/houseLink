[project]
name = "crib-link"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
filterwarnings = ["ignore:No directory at:UserWarning"]
addopts = "-q --strict-markers --cov=apps --cov=config --cov-report=term-missing:skip-covered --cov-fail-under=80"

[tool.coverage.run]
branch = true
omit = ["*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py", "config/settings/dev.py", "config/settings/prod.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "SIM", "C4", "RUF"]
ignore = ["RUF012"]  # mutable class attrs are idiomatic in Django Meta/admin

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S105", "S106", "S311", "SIM117"]
"conftest.py" = ["S101", "S106"]
