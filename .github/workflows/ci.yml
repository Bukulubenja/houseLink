name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crib
          POSTGRES_PASSWORD: crib
          POSTGRES_DB: crib
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crib" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://crib:crib@localhost:5432/crib
      CACHE_URL: rediscache://localhost:6379/1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Tests (PostgreSQL + Redis, 80% coverage gate)
        run: pytest

      - name: Production settings pass the deploy check
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-key-0123456789
          PII_HASH_KEY: ci-only-${{ github.run_id }}-not-a-real-pii-key-abcdefghijk
          DJANGO_ALLOWED_HOSTS: criblink.example
          CELERY_BROKER_URL: redis://localhost:6379/0
          S3_ACCESS_KEY_ID: ci
          S3_SECRET_ACCESS_KEY: ci
          S3_PUBLIC_BUCKET: ci-public
          S3_PRIVATE_BUCKET: ci-private
          PAYMENT_MERCHANT_NUMBER: "0772000000"

      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt
